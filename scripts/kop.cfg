[Menu]
fullscreen  = 0 // Intended: kop default for windowed vs fullscreen (BOOL). Startup overwrites from video.ini (fullScreen); if that runs, kop is only a fallback before UI load.
screenmode  = 0 // Legacy PKO-era preset index loaded into CGameConfig::m_btScreenMode; not referenced elsewhere in this client sources (resolution/in UI scale use video.ini: CurrentRes*, pixel1024 instead).
light_dir   = -1,-1,-1 // World directional light axis (RGB as x,y,z) applied at scene init via g_Render.SetDirectLightDir(...)
light_color = 0.6,0.6,0.6 // Diffuse/color scale for that directional light via SetDirectLightColor(..., 1.0f alpha) at scene init (not terrain day/night mixes).
lgt_factor = 0.4 // In DaylightByServerTime2: blend weight between area light diffuse and terrain tile color (larger = more tile tint), see SceneRender blend with fLgt.
lgt_bkcolor = 255, 255, 255 // D3DRS_AMBIENT color (stored as RGB bytes + full alpha); used during scene character render ambient pass (dw format A8R8G8B8 style packing in config).
fullscreen_antialias = 0 // 0 = no MSAA (less GPU). Non-zero = D3D multisample level (name is legacy; applied at startup for all modes).

