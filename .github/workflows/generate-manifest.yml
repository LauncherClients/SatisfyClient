# Generate manifest.json after each content push.
# Commits only when the hashed file differs. A matching manual manifest is left alone.
# A push that only changes manifest.json is ignored (no loop).
# GitHub: Settings → Actions → General → Workflow permissions = Read and write.
# Leave "create and approve pull requests" off.
name: Generate manifest

on:
  push:
    branches: [main]
    paths-ignore:
      - manifest.json
      - launcher/windows/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hash game tree
        run: python scripts/generate_manifest.py --root . --out manifest.json

      - name: Hash launcher pack
        run: |
          VERSION=$(python -c "import json; print(json.load(open('channel.json', encoding='utf-8'))['launcher']['version'])")
          python scripts/generate_manifest.py --root launcher/windows --out launcher/windows/manifest.json --version "$VERSION"

      - name: Commit manifests if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json launcher/windows/manifest.json
          if git diff --cached --quiet; then
            echo "manifests are already up to date"
            exit 0
          fi
          git commit -m "Update manifest.json"
          git push
